# qmllint settings for this repository. Every QML file is linted with the Qt 6 binary against the
# stand-ins in lint/ (see lint/README.md):
#
#   /usr/lib/qt6/bin/qmllint -I lint <file.qml>
#
# Zero warnings is the bar, and tests/qml.test.sh enforces it.
[General]
DisableDefaultImports=false
MaxWarnings=0

# One category is switched off. The linter cannot see members looked up on an object declared as a
# plain QtObject, although they resolve at run time: the panel's `theme` token object (a QtObject by
# contract), `Qt.styleHints`, and the shell's own token groups. The stand-ins in lint/ are typed, so a
# run with --ignore-settings still checks every shell member this plugin reads.
# qmllint renamed the category in Qt 6.6; both spellings are listed so older and newer Qt agree.
# Unresolved types, failed imports, unqualified access and wrong signal handlers all stay on.
[Warnings]
MissingProperty=disable
UnknownProperty=disable
